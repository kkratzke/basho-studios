<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eee9dc">
  <meta name="description" content="Basho Studios. Games, in the making.">
  <title>Basho Studios</title>
  <link rel="canonical" href="https://bashostudios.com/">
  <link rel="icon" href="/mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <main>
    <picture class="landscape" aria-hidden="true">
      <source media="(max-width: 700px)" srcset="/assets/landscape-mobile.webp">
      <img src="/assets/landscape-1600.webp" srcset="/assets/landscape-1600.webp 1600w, /assets/landscape-2560.webp 2560w" sizes="100vw" width="2560" height="1440" alt="" fetchpriority="high" decoding="async">
    </picture>
    <div class="identity">
      <div class="brand-logo-mark" aria-hidden="true">
        <span class="brand-logo-card brand-logo-card-back"></span>
        <span class="brand-logo-card brand-logo-card-middle"></span>
        <span class="brand-logo-card brand-logo-card-front"></span>
        <span class="brand-logo-monogram">DB</span>
      </div>
      <p class="japanese" lang="ja">第三の場所</p>
      <h1>Basho Studios</h1>
      <p class="tagline">Games, in the making.</p>
      <nav aria-label="Explore Basho Studios">
        <a class="selection games" href="#games">
          <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M10 9h12c4 0 5 4 6 9l1 5c.5 4-4 5-6 2l-3-4h-8l-3 4c-2 3-6.5 2-6-2l1-5c1-5 2-9 6-9Z"/><path d="M9 13v7m-3.5-3.5h7"/><circle cx="22" cy="14" r="1"/><circle cx="25" cy="18" r="1"/></svg>
          <span>Games</span><span class="arrow" aria-hidden="true">↗</span>
        </a>
        <a class="selection shop" href="https://daisannobasho.com/store">
          <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="5" y="5" width="17" height="22" rx="2" transform="rotate(-13 13.5 16)"/><rect x="11" y="4" width="17" height="23" rx="2"/><path d="M16 9h7m-7 13h7m-3.5-10 3 4-3 4-3-4Z"/></svg>
          <span>Shop</span><span class="arrow" aria-hidden="true">↗</span>
        </a>
      </nav>
    </div>
    <section id="games" class="games-panel" aria-labelledby="games-heading">
      <div class="panel-inner">
        <a class="close" href="#" aria-label="Close Games">×</a>
        <h2 id="games-heading" tabindex="-1">Basho Games</h2>
        <p>In development.</p>
      </div>
    </section>
  </main>
  <footer><span>© 2026 Basho Studios</span><a href="/credits.html">Landscape by Lingdong Huang</a></footer>
</body>
</html>
